# Minimal CI for attack-coverage-mapper.
#
# Runs the offline test suite on both supported interpreters.
# - `network` marker (live ATT&CK/SigmaHQ downloads) is excluded via `-m "not network"`.
# - `--strict-markers` is also enforced by pyproject addopts; repeated here so the
#   gate holds even if someone edits local config.
# - Marker registration lives in pyproject.toml ([tool.pytest.ini_options].markers),
#   which --strict-markers validates against; unknown markers would fail fast here.
# - pythonpath=["src", "."] from pyproject makes imports work without env vars.
name: CI

'on':
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report failures on both interpreters instead of cancelling the sibling job.
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cache the pip wheel cache keyed on dependency files.
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (offline suite)
        run: pytest -m "not network" --strict-markers
